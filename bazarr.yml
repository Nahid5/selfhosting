# Subtitles
---
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - {{ CHANGE ME }}:/config
      - {{ CHANGE ME }}:/movies #optional
      - {{ CHANGE ME }}:/tv #optional
    ports:
      - 6767:6767
    restart: unless-stopped
