services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 0:0
    group_add:
      - "993"
    environment:
      - TZ=America/New_York
    volumes:
      - {{ CHANGE ME }}:/config
      - {{ CHANGE ME }}:/data/tvshows
      - {{ CHANGE ME }}:/data/movies
      - {{ CHANGE ME }}:/transcode
    devices:
      - /dev/dri:/dev/dri  # Pass through the Intel iGPU
    ports:
      - 8096:8096
    restart: unless-stopped
