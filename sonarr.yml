---
version: "2.1"
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PUID=1000
      - TZ=America/New_York
    volumes:
      - {{ CHANGE ME }}:/config
      - {{ CHANGE ME }}:/data
    ports:
      - 8989:8989
    restart: unless-stopped
